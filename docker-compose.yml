name: pulse-ai

services:

  frontend:
    build: ./frontend
    container_name: pulse-frontend
    ports:
      - "3002:3000"
    restart: unless-stopped

  # ✅ ONLY ONE DOCKER SERVER
  node-exporter:
    image: prom/node-exporter:latest
    container_name: pulse-node-exporter
    restart: unless-stopped
    ports:
      - "9101:9100"

  # ✅ TEST SERVER (FAKE)
  node-exporter-test:
    image: prom/node-exporter:latest
    container_name: pulse-node-exporter-test
    restart: unless-stopped
    ports:
      - "9102:9100"

  prometheus:
    image: prom/prometheus:latest
    container_name: pulse-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: pulse-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: Pulse@123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - grafana_data:/var/lib/grafana

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: pulse-streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./app.py:/app/app.py
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501

volumes:
  prometheus_data:
  grafana_data: