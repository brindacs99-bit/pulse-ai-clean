name: pulse-ai

services:

  frontend:
    build: ./frontend
    container_name: pulse-frontend
    ports:
      - "3002:3000"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: pulse-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
  

  prometheus:
    image: prom/prometheus:latest
    container_name: pulse-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: pulse-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: Pulse@123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - grafana_data:/var/lib/grafana

  influxdb:
    image: influxdb:2.7
    container_name: pulse-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: PulseInflux@123
      DOCKER_INFLUXDB_INIT_ORG: pulse-ai
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: pulse-ai-secure-token
    volumes:
      - influxdb_data:/var/lib/influxdb2

  telegraf:
    image: telegraf:latest
    container_name: pulse-telegraf
    restart: unless-stopped
    depends_on:
      - influxdb
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf

  mlflow:
    image: ghcr.io/mlflow/mlflow
    container_name: pulse-mlflow
    restart: unless-stopped
    ports:
      - "5050:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./artifacts:/artifacts
    command: >
      mlflow server
      --backend-store-uri file:///mlruns
      --default-artifact-root file:///artifacts
      --host 0.0.0.0
      --port 5000

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: pulse-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models
    depends_on:
      - prometheus

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: pulse-streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./app.py:/app/app.py
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501

volumes:
  prometheus_data:
  grafana_data:
  influxdb_data: