global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "mac-host"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "docker-server"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "test-server"
    static_configs:
      - targets: ["node-exporter2:9100"]