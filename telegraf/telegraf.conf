[agent]
  interval = "300s"            # Collect every 5 minutes
  flush_interval = "300s"      # Flush every 5 minutes

# Aligned with docker-compose and Python scripts (pulse-ai / metrics)
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "pulse-ai-secure-token"
  organization = "pulse-ai"
  bucket = "metrics"

# Collect CPU metrics
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

# Collect memory metrics
[[inputs.mem]]
